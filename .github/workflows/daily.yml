name: daily quotes

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: How many quotes to add
        default: "3"

permissions:
  contents: write

concurrency:
  group: pack
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest new quotes
        run: python scripts/harvest.py --count "${{ inputs.count || '3' }}"
      - name: Rebuild the pack
        run: python scripts/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing new today"
          else
            git commit -m "Add daily quotes"
            git pull --rebase
            git push
          fi
